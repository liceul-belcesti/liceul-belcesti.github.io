<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platforma școlii</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5b6478; --accent:#1f4fd8; --err:#b42318; --line:#d9deea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151d; --card:#1b2030; --text:#eef1f8; --muted:#9aa3b8; --accent:#6c8cff; --err:#ff8a80; --line:#2c3347; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
    h1 { font-size:1.3rem; margin:0 0 4px; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; }
    label { display:block; font-size:.9rem; margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; font:inherit; color:var(--text); background:transparent;
            border:1px solid var(--line); border-radius:8px; }
    input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    button { width:100%; margin-top:20px; padding:12px; font:inherit; font-weight:600; color:#fff;
             background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
    button.google { margin-top:0; }
    button:disabled { opacity:.6; cursor:default; }
    .sep { display:flex; align-items:center; gap:10px; margin:18px 0 0; color:var(--muted); font-size:.85rem; }
    .sep::before, .sep::after { content:""; flex:1; height:1px; background:var(--line); }
    .msg { margin:0 0 18px; padding:14px 16px; font-size:1.15rem; font-weight:700; line-height:1.4;
           color:var(--err); border:2px solid var(--err); border-radius:10px; }
    .msg.info { color:var(--accent); border-color:var(--accent); }
    .msg:empty { display:none; }
    .foot { margin-top:18px; font-size:.82rem; color:var(--muted); text-align:center; }
    .foot a { color:var(--muted); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="card">
    <section id="login">
      <div id="msg" class="msg" role="alert"></div>
      <h1>Platforma școlii</h1>
      <p class="sub">Autentifică-te pentru a accesa platforma.</p>

      <button id="google" class="secondary google" type="button">Continuă cu Google</button>
      <div class="sep">sau cu e-mail</div>

      <form id="form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="parola">Parolă</label>
        <input id="parola" type="password" autocomplete="current-password" required>
        <button id="btn" type="submit">Intră în cont</button>
      </form>
      <p class="foot">
        <a href="confidentialitate.html">Confidențialitate</a> ·
        <a href="termeni.html">Termeni</a>
      </p>
    </section>

    <section id="acasa" class="hidden">
      <h1>Bun venit!</h1>
      <p class="sub">Ești autentificat ca <strong id="cine"></strong>.</p>
      <p>Rol: <strong id="rol"></strong></p>
      <p>Aici vor apărea modulele platformei.</p>
      <button id="iesire" class="secondary" type="button">Ieși din cont</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    const ETICHETE = { administrator: "Administrator", profesor: "Profesor", parinte: "Părinte", elev: "Elev" };
    const MESAJ_ASTEPTARE = "Contul tău a fost creat și așteaptă aprobarea administratorului. Vei putea intra după aprobare.";
    const MESAJ_FARA_ACCES = "Contul tău nu are acces la platformă. Contactează administratorul.";

    // Mesajul rămâne afișat chiar dacă ieșirea din cont declanșează o nouă verificare.
    let mesajRamas = "";

    function arataLogin(mesaj) {
      $("login").classList.remove("hidden");
      $("acasa").classList.add("hidden");
      const m = mesaj || mesajRamas || "";
      $("msg").textContent = m;
      $("msg").className = "msg" + (m === MESAJ_ASTEPTARE ? " info" : "");
    }

    // Verifică în baza de date dacă utilizatorul are un profil activ.
    // Regulile din Supabase (RLS) sunt cele care protejează datele; pagina doar afișează.
    async function verificaAcces(sesiune) {
      if (!sesiune) return arataLogin();
      const { data, error } = await db
        .from("profiluri")
        .select("nume, rol, activ")
        .eq("id", sesiune.user.id)
        .maybeSingle();

      if (error || !data || !data.activ) {
        mesajRamas = (data && !data.activ) ? MESAJ_ASTEPTARE : MESAJ_FARA_ACCES;
        await db.auth.signOut();
        return arataLogin(mesajRamas);
      }
      mesajRamas = "";
      $("login").classList.add("hidden");
      $("acasa").classList.remove("hidden");
      $("cine").textContent = data.nume + " (" + sesiune.user.email + ")";
      $("rol").textContent = ETICHETE[data.rol] || data.rol;
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      mesajRamas = "";
      $("msg").textContent = "";
      $("msg").className = "msg";
      $("btn").disabled = true;
      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("parola").value
      });
      $("btn").disabled = false;
      if (error) $("msg").textContent = "E-mail sau parolă incorectă.";
      $("parola").value = "";
    });

    $("google").addEventListener("click", async () => {
      mesajRamas = "";
      $("msg").textContent = "";
      $("msg").className = "msg";
      const { error } = await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: "https://liceul-belcesti.github.io/" }
      });
      if (error) $("msg").textContent = "Autentificarea cu Google nu a reușit. Încearcă din nou.";
    });

    $("iesire").addEventListener("click", () => { mesajRamas = ""; db.auth.signOut(); });

    // Dacă Google/Supabase întorc o eroare în adresă, o arătăm clar și curățăm adresa.
    (function () {
      const text = location.search + "&" + location.hash.replace(/^#/, "");
      if (/error(_code)?=/.test(text)) {
        mesajRamas = /signup_disabled/.test(text)
          ? "Crearea de conturi noi nu este deschisă momentan. Contactează administratorul școlii."
          : "Autentificarea nu a reușit. Încearcă din nou sau contactează administratorul.";
        history.replaceState(null, "", location.pathname);
      }
    })();

    // setTimeout: evită apelurile către Supabase direct în callback-ul de autentificare
    db.auth.onAuthStateChange((_event, sesiune) => setTimeout(() => verificaAcces(sesiune), 0));
  </script>
</body>
</html>
