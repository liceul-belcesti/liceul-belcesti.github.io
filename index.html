<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7f8a">
  <title>Platforma școlii</title>
  <style>
    :root {
      --teal-900:#064e57; --teal-700:#0b7f8a; --teal-500:#14b8c4; --teal-100:#d9f3f5;
      --bg:#eef7f8; --card:#ffffff; --text:#13292d; --muted:#53686c; --line:#cfe3e5;
      --accent:#0b7f8a; --on-accent:#ffffff; --err:#b42318; --shadow:0 10px 30px rgba(6,78,87,.15);
      --hero-a:#0b7f8a; --hero-b:#064e57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0d1a1c; --card:#14272a; --text:#e8f5f6; --muted:#9ab6ba; --line:#244045;
        --accent:#3cc9d6; --on-accent:#06262a; --err:#ff8a80; --shadow:0 10px 30px rgba(0,0,0,.4);
        --teal-100:#17353a; --hero-a:#0a5a63; --hero-b:#041f23;
      }
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text);
           font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .hidden { display:none !important; }

    /* ---------- Autentificare ---------- */
    .auth { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:22px; padding:max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            background:linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
    .brand { text-align:center; color:#fff; max-width:420px; }
    .brand .mark { width:64px; height:64px; margin:0 auto 12px; border-radius:18px; display:grid; place-items:center;
                   background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); font-size:32px; }
    .brand h1 { margin:0; font-size:1.35rem; line-height:1.25; font-weight:700; }
    .brand p { margin:6px 0 0; opacity:.85; font-size:.95rem; }
    .card { width:100%; max-width:400px; background:var(--card); border-radius:18px; padding:26px 22px; box-shadow:var(--shadow); }
    .card h2 { margin:0 0 4px; font-size:1.2rem; }
    .card p.sub { margin:0 0 18px; color:var(--muted); font-size:.95rem; }
    label { display:block; font-size:.9rem; margin:14px 0 6px; font-weight:600; }
    input { width:100%; min-height:48px; padding:11px 14px; font:inherit; color:var(--text); background:transparent;
            border:1.5px solid var(--line); border-radius:10px; }
    input:focus { outline:3px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color:var(--accent); }
    button { width:100%; min-height:48px; margin-top:18px; padding:12px; font:inherit; font-weight:700; color:var(--on-accent);
             background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    button.secondary { background:transparent; color:var(--text); border:1.5px solid var(--line); }
    button.google { margin-top:0; display:flex; align-items:center; justify-content:center; gap:10px; }
    button:disabled { opacity:.6; cursor:default; }
    .sep { display:flex; align-items:center; gap:10px; margin:18px 0 0; color:var(--muted); font-size:.85rem; }
    .sep::before, .sep::after { content:""; flex:1; height:1px; background:var(--line); }
    .msg { margin:0 0 18px; padding:14px 16px; font-size:1.15rem; font-weight:700; line-height:1.4;
           color:var(--err); border:2px solid var(--err); border-radius:10px; }
    .msg.info { color:var(--accent); border-color:var(--accent); }
    .msg:empty { display:none; }
    .foot { margin:18px 0 0; font-size:.82rem; color:var(--muted); text-align:center; }
    .foot a { color:var(--muted); }
    .auth .legal { color:rgba(255,255,255,.8); font-size:.82rem; text-align:center; }
    .auth .legal a { color:#fff; }

    /* ---------- Pagina principală ---------- */
    .bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px;
           padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top));
           background:linear-gradient(90deg, var(--hero-a), var(--hero-b)); color:#fff; }
    .bar .name { font-weight:700; line-height:1.2; font-size:1rem; }
    .bar .name small { display:block; font-weight:400; opacity:.85; font-size:.78rem; }
    .bar button { width:auto; min-height:40px; margin:0; padding:8px 14px; color:#fff; background:rgba(255,255,255,.16);
                  border:1px solid rgba(255,255,255,.4); font-size:.9rem; white-space:nowrap; flex-shrink:0; }
    .wrap { max-width:960px; margin:0 auto; padding:22px 16px max(32px, env(safe-area-inset-bottom)); }
    .hello { margin:0 0 4px; font-size:1.5rem; line-height:1.2; }
    .who { margin:0 0 6px; color:var(--muted); }
    .role { display:inline-block; padding:3px 12px; border-radius:999px; background:var(--teal-100); color:var(--accent);
            font-weight:700; font-size:.85rem; }
    h3.sect { margin:26px 0 12px; font-size:1.05rem; }
    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    @media (min-width:640px) { .grid { grid-template-columns:repeat(3, 1fr); gap:16px; } }
    @media (min-width:900px) { .grid { grid-template-columns:repeat(4, 1fr); } }
    .tile { position:relative; min-height:128px; padding:16px 14px; display:flex; flex-direction:column; gap:6px;
            background:var(--card); border:1.5px solid var(--line); border-radius:16px; }
    .tile .ico { font-size:1.9rem; line-height:1; }
    .tile .t { font-weight:700; line-height:1.2; }
    .tile .d { color:var(--muted); font-size:.82rem; line-height:1.3; }
    .tile .soon { position:absolute; top:10px; right:10px; padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700;
                  background:var(--teal-100); color:var(--accent); }
    .tile.off { opacity:.85; }
  </style>
</head>
<body>
  <!-- AUTENTIFICARE -->
  <div id="login" class="auth">
    <header class="brand">
      <div class="mark" aria-hidden="true">🎓</div>
      <h1>Liceul Tehnologic „Victor Mihăilescu Craiu” Belcești</h1>
      <p>Platforma școlii</p>
    </header>

    <main class="card">
      <div id="msg" class="msg" role="alert"></div>
      <h2>Autentificare</h2>
      <p class="sub">Intră în contul tău pentru a continua.</p>

      <button id="google" class="secondary google" type="button">Continuă cu Google</button>
      <div class="sep">sau cu e-mail</div>

      <form id="form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" required>
        <label for="parola">Parolă</label>
        <input id="parola" type="password" autocomplete="current-password" required>
        <button id="btn" type="submit">Intră în cont</button>
      </form>
    </main>

    <p class="legal">
      <a href="confidentialitate.html">Confidențialitate</a> ·
      <a href="termeni.html">Termeni</a>
    </p>
  </div>

  <!-- PAGINA PRINCIPALĂ -->
  <div id="acasa" class="hidden">
    <header class="bar">
      <div class="name">Platforma școlii<small>Liceul Tehnologic „Victor Mihăilescu Craiu” Belcești</small></div>
      <button id="iesire" type="button">Ieși din cont</button>
    </header>
    <main class="wrap">
      <h1 class="hello">Bun venit, <span id="prenume"></span>!</h1>
      <p class="who"><span id="cine"></span></p>
      <span class="role" id="rol"></span>

      <h3 class="sect">Modulele tale</h3>
      <div id="module" class="grid"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    const ETICHETE = { administrator: "Administrator", profesor: "Profesor", parinte: "Părinte", elev: "Elev" };
    const MESAJ_ASTEPTARE = "Contul tău a fost creat și așteaptă aprobarea administratorului. Vei putea intra după aprobare.";
    const MESAJ_FARA_ACCES = "Contul tău nu are acces la platformă. Contactează administratorul.";

    // Modulele afișate pentru fiecare rol (deocamdată inactive; le activăm pe rând).
    const MODULE = {
      aprobare: { ico: "✅", t: "Aprobare conturi", d: "Conturi noi în așteptare" },
      anunturi: { ico: "📢", t: "Anunțuri", d: "Informări de la școală" },
      orar:     { ico: "🗓️", t: "Orar", d: "Orarul claselor și al profesorilor" },
      altfel:   { ico: "🎨", t: "Școala Altfel", d: "Programul săptămânii" },
      registru: { ico: "📁", t: "Registratură", d: "Documente și numere de înregistrare" },
      catalog:  { ico: "📘", t: "Situație școlară", d: "Note și absențe" }
    };
    const PE_ROL = {
      administrator: ["aprobare", "anunturi", "orar", "altfel", "registru"],
      profesor:      ["anunturi", "orar", "altfel", "registru"],
      parinte:       ["anunturi", "orar", "catalog"],
      elev:          ["anunturi", "orar", "catalog"]
    };

    function deseneazaModule(rol) {
      const zona = $("module");
      zona.replaceChildren();
      (PE_ROL[rol] || ["anunturi"]).forEach((cheie) => {
        const m = MODULE[cheie];
        const c = document.createElement("div");
        c.className = "tile off";
        const soon = document.createElement("span"); soon.className = "soon"; soon.textContent = "În curând";
        const ico = document.createElement("div"); ico.className = "ico"; ico.setAttribute("aria-hidden", "true"); ico.textContent = m.ico;
        const t = document.createElement("div"); t.className = "t"; t.textContent = m.t;
        const d = document.createElement("div"); d.className = "d"; d.textContent = m.d;
        c.append(soon, ico, t, d);
        zona.appendChild(c);
      });
    }

    // Mesajul rămâne afișat chiar dacă ieșirea din cont declanșează o nouă verificare.
    let mesajRamas = "";

    function arataLogin(mesaj) {
      $("login").classList.remove("hidden");
      $("acasa").classList.add("hidden");
      const m = mesaj || mesajRamas || "";
      $("msg").textContent = m;
      $("msg").className = "msg" + (m === MESAJ_ASTEPTARE ? " info" : "");
    }

    // Verifică în baza de date dacă utilizatorul are un profil activ.
    // Regulile din Supabase (RLS) sunt cele care protejează datele; pagina doar afișează.
    async function verificaAcces(sesiune) {
      if (!sesiune) return arataLogin();
      const { data, error } = await db
        .from("profiluri")
        .select("nume, rol, activ")
        .eq("id", sesiune.user.id)
        .maybeSingle();

      if (error || !data || !data.activ) {
        mesajRamas = (data && !data.activ) ? MESAJ_ASTEPTARE : MESAJ_FARA_ACCES;
        await db.auth.signOut();
        return arataLogin(mesajRamas);
      }
      mesajRamas = "";
      $("login").classList.add("hidden");
      $("acasa").classList.remove("hidden");
      $("prenume").textContent = (data.nume || "").split(" ")[0];
      $("cine").textContent = data.nume + " · " + sesiune.user.email;
      $("rol").textContent = ETICHETE[data.rol] || data.rol;
      deseneazaModule(data.rol);
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      mesajRamas = "";
      $("msg").textContent = "";
      $("msg").className = "msg";
      $("btn").disabled = true;
      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("parola").value
      });
      $("btn").disabled = false;
      if (error) $("msg").textContent = "E-mail sau parolă incorectă.";
      $("parola").value = "";
    });

    $("google").addEventListener("click", async () => {
      mesajRamas = "";
      $("msg").textContent = "";
      $("msg").className = "msg";
      const { error } = await db.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: "https://liceul-belcesti.github.io/" }
      });
      if (error) $("msg").textContent = "Autentificarea cu Google nu a reușit. Încearcă din nou.";
    });

    $("iesire").addEventListener("click", () => { mesajRamas = ""; db.auth.signOut(); });

    // Dacă Google/Supabase întorc o eroare în adresă, o arătăm clar și curățăm adresa.
    (function () {
      const text = location.search + "&" + location.hash.replace(/^#/, "");
      if (/error(_code)?=/.test(text)) {
        mesajRamas = /signup_disabled/.test(text)
          ? "Crearea de conturi noi nu este deschisă momentan. Contactează administratorul școlii."
          : "Autentificarea nu a reușit. Încearcă din nou sau contactează administratorul.";
        history.replaceState(null, "", location.pathname);
      }
    })();

    // setTimeout: evită apelurile către Supabase direct în callback-ul de autentificare
    db.auth.onAuthStateChange((_event, sesiune) => setTimeout(() => verificaAcces(sesiune), 0));
  </script>
</body>
</html>
